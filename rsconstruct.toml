# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.markdown]

[processor.checker.rumdl]
src_dirs = ["exercises"]

[processor.checker.zspell]
src_dirs = ["exercises"]

[processor.checker.ishellcheck]
src_dirs = ["scripts", "exercises", "apps/ManyExercisesTogether/scripts", "c"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "rsconstruct.toml"]

# lint the Lua configuration with luacheck (policy: .luacheckrc)
[processor.checker.iluacheck]
src_dirs = ["config"]

# lint the YAML files with yamllint (policy: .yamllint.yaml)
[processor.checker.iyamllint]
src_dirs = [".github"]
src_files = [".yamllint.yaml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The pedantic persona: also the findings zizmor's default persona keeps
# quiet (undocumented permissions, template expansion of any context,
# unnamed jobs, ...). --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=pedantic"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.checker.ixmllint]
src_files = ["checkstyle.xml"]
# warnings fail too, not only fatal errors
strict = true
src_dirs = ["apps", "c"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

# Each C file is its own program/JNI library (one per directory), so the default one-run-per-file mode fits.
[processor.checker.cppcheck]
dep_inputs = ["cppcheck.cfg"]
src_dirs = ["c"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
	"--library=cppcheck.cfg",
]

# ─── java ────────────────────────────────────────────────────────────────────

[processor.checker.icheckstyle]
src_dirs = ["apps", "c"]
