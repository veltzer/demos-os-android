# rsconstruct build configuration for this repository.

[analyzer.markdown]

[processor.rumdl]
src_dirs = ["exercises"]

[processor.zspell]
src_dirs = ["exercises"]

[processor.shellcheck]
src_dirs = ["scripts", "exercises", "apps/ManyExercisesTogether/scripts", "c"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.xmllint]
src_dirs = ["apps", "c"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

[processor.cppcheck]
src_dirs = ["c"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]

# ─── java ────────────────────────────────────────────────────────────────────

[processor.checkstyle]
src_dirs = ["apps", "c"]
args = ["-c", "checkstyle.xml"]
